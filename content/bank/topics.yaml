# AgentReady content bank — one topic per day.
#
# The studio turns each topic into a full Reel/Short + LinkedIn carousel + captions
# automatically (see studio/compose.py). You don't write scenes here, just ideas.
#
# Fields (all optional except id, title, hook):
#   pillar     label shown on screen: news | myth | tip | demo | shift | stat | qa | insight
#   hook       first 3 seconds (Hinglish works best on Reels)
#   myth/fact  for myth-busting topics
#   news       one-line news summary
#   chat       {user, items, missing} -> animated AI-assistant chat
#   stat       {value, label, source} -> counting number
#   point      the one idea of the video (+ point_sub)
#   compare    {left: {title, items}, right: {title, items}}
#   heading + items -> checklist / steps   (icon: check | cross | number | arrow)
#   caption    Instagram / Shorts caption (auto-made if missing)
#   linkedin   LinkedIn post text (auto-made if missing)
#
# Rules: nothing is live yet (no links, "visit", "sign up", "waitlist", "buy now"), and we are in
# stealth: teach the problem, never mention a tool/app/checker/launch. The studio enforces both.
#
# Order = posting order. Posting days are Mon-Fri (content/schedule.yaml); Sunday = weekly YouTube.
#   vo         optional: one spoken line per scene, if the auto-written voiceover.txt doesn't fit
# Facts must have a real source. Add new topics at the end; the calendar picks them up.

topics:

  # ======================================================================================
  # PHASE 1 · WAKE-UP (weeks 1-4, 16 Nov - 13 Dec): AI shopping is here; what it is; first easy fixes
  # ======================================================================================

  # ---------------------------------------------------------------- week 1

  - id: ai-asks-not-searches
    pillar: shift
    title: Customers now ask AI what to buy
    hook: Aapki shop **ChatGPT** ko dikhti hai?
    chat:
      user: Best cotton kurta under ₹1000 batao, jaldi delivery chahiye
      items: ["Flipkart · 1-day delivery", "Big brand store · 4.5 rating", "Another big seller · COD available"]
      missing: Aapki shop? **List mein hi nahi.**
    point: AI sirf woh shops recommend karta hai jinka data woh **padh sake**
    heading: 3 cheezein aaj hi check karo
    items:
      - Har product ka **price, size, stock** text mein likha ho
      - Delivery aur **COD info** clear ho
      - Product titles simple aur **specific** ho
    linkedin: |
      Shoppers are starting to ask AI assistants what to buy, instead of searching.
      And an AI assistant can only recommend what it can read.

      If your price, size, stock and delivery details are locked inside images or messy pages, you are invisible to it.

      Three things every online seller can check today:
      1. Price, size and stock written as text
      2. Delivery and COD info clearly stated
      3. Simple, specific product titles

  - id: stat-92-percent
    pillar: stat
    title: 92% of shoppers in India's metros have used AI while shopping
    hook: Yeh number **ignore mat karna**
    stat: { value: 92%, label: shoppers have **already used AI** while shopping, source: "NielsenIQ, Agentic Commerce India 2026 (top 8 metros)" }
    point: Sawaal yeh nahi ki AI shopping aayegi. Sawaal yeh hai ki **aapki shop ready hai?**
    linkedin: |
      92% of consumers in India's top 8 metros have already used AI while shopping (NielsenIQ, Agentic Commerce India 2026).

      AI is no longer a side channel for discovery. It is becoming the first step.

      The question for small sellers isn't "will AI shopping come?" It's "will AI find my products when it does?"

  - id: what-is-ai-agent
    pillar: shift
    title: What is an AI shopping agent?
    hook: AI **agent** kya hota hai? 20 second mein samjho
    point: Chatbot sirf **jawab deta hai**. Agent aapke liye **kaam karta hai**.
    compare:
      left: { title: Chatbot, items: ["Batata hai kaunsa kurta achha hai", "Aapko khud dhoondhna padta hai", "Aap khud order karte ho"] }
      right: { title: AI agent, items: ["Aapki pasand samajhta hai", "Shops compare karta hai", "Aapki permission se order bhi karta hai"] }

  - id: myth-only-big-brands
    pillar: myth
    title: "Myth: AI shopping is only for big brands"
    hook: AI shopping sirf **bade brands** ke liye hai?
    myth: AI agents sirf Amazon aur Flipkart jaise bade platforms se khareedenge
    fact: AI agent ko **brand size se farak nahi padta**. Use clear, readable data chahiye.
    heading: Chhote seller ka advantage
    items:
      - Aap jaldi **change** kar sakte ho
      - Aapka product **niche** aur specific hai
      - Clean data se aap bhi **recommend** ho sakte ho
    linkedin: |
      Myth: AI shopping agents will only buy from the biggest platforms.

      Reality: an agent picks what best matches the request, using data it can read and trust. Size alone doesn't win. Clarity does.

      Small sellers have an edge here: they can fix their product data this week, not next quarter.

  - id: tip-product-titles
    pillar: tip
    title: Write product titles an AI can understand
    hook: Aapka product title **AI ko confuse** kar raha hai
    compare:
      left: { title: Confusing title, items: ["Summer Special Mega Combo!!!", "Best Quality Product", "New Arrival 2026"] }
      right: { title: AI-friendly title, items: ["Women's cotton kurta, blue, size M", "Steel water bottle, 1 litre, insulated", "Men's running shoes, size 9, grey"] }
    point: Title mein likho **kya hai, kiske liye, kaunsa size/colour**
    heading: Perfect title formula
    items:
      - "**Product type** + material"
      - "**Kiske liye** (men, women, kids)"
      - "**Size / colour / quantity**"
    linkedin: |
      "Summer Special Mega Combo!!!" might work in an Instagram ad. To an AI shopping agent, it means nothing.

      A title an agent can match to a request looks like: "Women's cotton kurta, blue, size M".

      Formula: product type + material + who it's for + size/colour/quantity.

  # ---------------------------------------------------------------- week 2

  - id: news-upi-agent-payments
    pillar: news
    title: AI agents are learning to pay with UPI
    hook: AI ab **UPI se payment** bhi karega?
    news: Razorpay aur NPCI ne Feb 2026 mein Claude par **agentic payments** launch kiye. Zomato, Swiggy, Zepto pehle partners the.
    point: Matlab AI sirf suggest nahi karega, **order bhi karega**
    point_sub: Aur NPCI agents ke liye ek common UPI protocol par kaam kar raha hai (reported)
    heading: Seller ke liye matlab
    items:
      - Payment ka **friction** kam hoga
      - Jo shops agent-ready hongi, unhe **pehle orders** milenge
      - Abhi se data **saaf** karna shuru karo
    linkedin: |
      In February 2026, Razorpay and NPCI launched agentic payments on Claude, with Zomato, Swiggy and Zepto as the first partners. Users can complete orders inside an AI conversation, on UPI.

      NPCI is also reported to be working on a Unified Agent Protocol so verified AI agents can make UPI payments within limits users set.

      For sellers, this means AI won't just recommend. It will complete the order. Stores that agents can read and trust will get those orders first.

  - id: how-ai-reads-store
    pillar: shift
    title: How an AI reads your store
    hook: AI aapki shop **kaise padhta hai**? Aapki tarah nahi.
    point: Aap **photo dekhte ho**. AI **text aur data padhta hai**.
    heading: AI sabse pehle yeh dhoondhta hai
    items: ["Product **kya hai** (title)", "**Price** aur stock", "**Delivery** aur returns"]

  - id: myth-images-are-enough
    pillar: myth
    title: "Myth: good photos are enough"
    hook: Sirf **achhi photos** kaafi hain?
    myth: Photo achhi hai toh product bik jayega
    fact: AI agent pehle **text padhta hai**. Photo mein likha price ya size use samajh nahi aata.
    heading: Photo ke saath yeh bhi likho
    items:
      - "**Price** aur offer text mein"
      - "**Size, colour, material** text mein"
      - Photo ka **alt text** (photo kya dikha rahi hai)
    linkedin: |
      Great product photos sell to humans. But an AI agent reads text first.

      If your price, size or offer only appears inside an image, the agent may never see it.

      Keep the photos, and also write price, size, colour and material as text, plus a short alt text describing each image.

  - id: tip-size-charts
    pillar: tip
    title: Size charts AI agents can read
    hook: '"Kya yeh **mujhe fit** hoga?" AI bhi yahi puchta hai'
    point: Size chart **image mein nahi**, text table mein do
    heading: Ek achha size chart
    items:
      - Har size ke **cm / inch** measurements
      - "**Fit type**: regular, slim, oversized"
      - "**Model ka size** aur height"
    linkedin: |
      "Will this fit me?" is one of the first questions a shopper asks, and one an AI agent has to answer for them.

      If your size chart is an image, the agent can't read it. Put it in a text table with measurements, fit type, and the model's size and height.

  - id: stat-cod-small-towns
    pillar: stat
    title: COD still matters in small-town India
    hook: Small towns mein **COD** abhi bhi king hai
    stat: { value: 70%, label: of small-town shoppers **prefer COD**, source: "Base, D2C Ecommerce in India 2026 report" }
    point: AI agent ko batao ki aap **COD dete ho**, warna woh aapko skip karega
    linkedin: |
      Around 70% of shoppers in small-town India still prefer cash on delivery (Base, D2C Ecommerce in India 2026).

      When an AI agent shops for someone who needs COD, it will filter out stores that don't clearly say they offer it.

      Payment options aren't a footer detail anymore. They're a matching criterion.

