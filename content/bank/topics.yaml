  - id: news-ondc-merchants
    pillar: news
    title: ONDC crossed 2 lakh active retail merchants
    hook: ONDC par **2 lakh+ sellers** aa chuke hain
    stat: { value: "200,000+", label: retail merchants **active on ONDC** by July 2026, source: "DPIIT figures, July 2026" }
    point: Open network + AI agents = **chhote sellers ke liye naya raasta**
    point_sub: Ek app se kharido, doosre network par baithe seller se
    linkedin: |
      By July 2026, more than 200,000 retail merchants were active on ONDC, according to DPIIT figures, and the network passed 500 million transactions.

      Why it matters for AI shopping: an open network means an AI agent in one app can, in principle, find and buy from a seller connected through another.

      For small sellers, that's a path to discovery that doesn't depend only on marketplace ranking.

  - id: tip-consistent-prices
    pillar: tip
    title: One price everywhere
    hook: Alag-alag **price** = AI ka trust khatam
    compare:
      left: { title: Confusing, items: ["Website: ₹999", "Instagram: ₹899", "WhatsApp: price on request"] }
      right: { title: Trustworthy, items: ["Everywhere: ₹999", "Offer clearly mentioned", "Same stock info everywhere"] }
    point: AI agent **conflicting data** waali shop ko recommend karne se bachta hai
    linkedin: |
      If your website says ₹999, Instagram says ₹899 and WhatsApp says "price on request", a human might DM you. An AI agent will likely move on.

      Consistent price, stock and offer details across every channel are a trust signal, for people and for agents.

  - id: myth-ai-will-replace-sellers
    pillar: myth
    title: "Myth: AI will replace sellers"
    hook: Kya AI **sellers ko khatam** kar dega?
    myth: AI agents aayenge toh chhote sellers ka business band
    fact: AI **kharidne ka tareeka** badlega, bechne waale nahi. Jo seller ready hoga, use **zyada customers** milenge.
    point: Darr nahi, **taiyari** chahiye
    linkedin: |
      AI agents won't replace sellers. They change how buying happens: who discovers what, and how the order gets placed.

      Sellers who make their products easy for agents to understand will reach customers they never could before. It's a preparation problem, not a survival one.

  - id: tip-return-policy
    pillar: tip
    title: A return policy AI can explain
    hook: Return policy **samajh nahi aayi** toh order nahi
    point: Return policy **3 lines** mein, simple shabdon mein
    heading: Teen cheezein zaroor likho
    items: ["**Kitne din** mein return", "Refund **kaise** milega", "Kaun se products **return nahi** honge"]
    linkedin: |
      Shoppers ask an AI assistant "Can I return it if it doesn't fit?" The agent answers from your return policy.

      If it's a long legal page, the agent may not find the answer. Keep three things clear: how many days, how the refund works, and what can't be returned.

