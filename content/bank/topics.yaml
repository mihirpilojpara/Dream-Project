  - id: myth-images-are-enough
    pillar: myth
    title: "Myth: good photos are enough"
    hook: Sirf **achhi photos** kaafi hain?
    myth: Photo achhi hai toh product bik jayega
    fact: AI agent pehle **text padhta hai**. Photo mein likha price ya size use samajh nahi aata.
    heading: Photo ke saath yeh bhi likho
    items:
      - "**Price** aur offer text mein"
      - "**Size, colour, material** text mein"
      - Photo ka **alt text** (photo kya dikha rahi hai)
    linkedin: |
      Great product photos sell to humans. But an AI agent reads text first.

      If your price, size or offer only appears inside an image, the agent may never see it.

      Keep the photos, and also write price, size, colour and material as text, plus a short alt text describing each image.

  - id: tip-size-charts
    pillar: tip
    title: Size charts AI agents can read
    hook: '"Kya yeh **mujhe fit** hoga?" AI bhi yahi puchta hai'
    point: Size chart **image mein nahi**, text table mein do
    heading: Ek achha size chart
    items:
      - Har size ke **cm / inch** measurements
      - "**Fit type**: regular, slim, oversized"
      - "**Model ka size** aur height"
    linkedin: |
      "Will this fit me?" is one of the first questions a shopper asks, and one an AI agent has to answer for them.

      If your size chart is an image, the agent can't read it. Put it in a text table with measurements, fit type, and the model's size and height.

  - id: demo-gift-search
    pillar: demo
    title: How an AI picks a gift
    hook: Dekho AI **gift kaise choose** karta hai
    chat:
      user: Meri mummy ke liye ₹1500 tak ka gift, Sunday tak delivery chahiye
      items: ["Silk saree · delivery by Friday", "Brass diya set · gift wrap included", "Skincare hamper · COD available"]
      missing: AI ne **delivery date aur gift wrap** dekha. Aapki listing mein likha hai?
    point: AI sirf product nahi, **poori detail** match karta hai
    heading: Gifting season ke liye likho
    items: ["Delivery **kab tak** pahunchegi", "Gift wrap **available** hai ya nahi", "**Kiske liye** perfect hai"]
    linkedin: |
      Watch what an AI assistant checks when someone asks for "a gift for my mother under ₹1500, delivered by Sunday":

      Price, yes. But also delivery date, gift wrapping and who the product is for.

      If your listing doesn't state those, the agent can't match you, even if your product is perfect.

