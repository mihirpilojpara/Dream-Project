  # ---------------------------------------------------------------- week 5

  - id: demo-delivery-pincode
    pillar: demo
    title: Why AI asks for your pin code
    hook: AI ne **pin code** kyun pucha?
    chat:
      user: Kal tak Indore mein delivery ho sake, aisa running shoe batao
      items: ["Brand A · delivers tomorrow", "Brand B · 2-day delivery", "Brand C · delivery info missing"]
      missing: Delivery info nahi? **AI skip kar deta hai.**
    point: Delivery **pin code aur time** clear likho
    linkedin: |
      "Running shoes delivered to Indore by tomorrow." A request like this filters stores by delivery promise before it looks at the product.

      If your delivery areas and times aren't stated clearly, the agent can't include you, so it skips you.

  - id: news-pine-labs-p3p
    pillar: news
    title: Pine Labs launched an agentic payment protocol on UPI
    hook: AI **ek baar permission** lekar payment karega
    news: Pine Labs ne June 2026 mein **P3P** launch kiya. AI agents ek upfront authorisation ke baad UPI payments complete kar sakte hain.
    point: Payment ka last step bhi **AI ke haath** mein aa raha hai
    linkedin: |
      In June 2026 Pine Labs launched P3P, an agentic payment protocol built on UPI. It lets AI agents complete UPI payments after a single upfront authorisation.

      Discovery, comparison and now payment: each step of shopping is becoming something an agent can do. Stores need to be ready at every step.

  - id: tip-stock-updates
    pillar: tip
    title: Out-of-stock is the fastest way to lose an AI's trust
    hook: '"In stock" likha, par **mila nahi**?'
    point: Galat stock info = AI agent ka **trust khatam**
    heading: Stock ko sahi rakho
    items: ["Har din **stock update** karo", "Out of stock products **mark** karo", "Restock date **likho** agar pata hai"]
    linkedin: |
      An agent that orders an item marked "in stock" and gets a cancellation learns not to trust that store.

      Keep stock accurate daily, clearly mark items as out of stock, and add a restock date when you know it.

  - id: myth-only-english
    pillar: myth
    title: "Myth: AI only understands English listings"
    hook: AI sirf **English** samajhta hai?
    myth: Hindi ya regional bhasha mein likha toh AI nahi samjhega
    fact: Aaj ke AI assistants **kai Indian bhashaon** mein kaam karte hain. Zaroori hai **clear aur complete** likhna.
    point: Apne customer ki **bhasha** mein, saaf likho
    linkedin: |
      Modern AI assistants work across many Indian languages. What matters most isn't the language. It's whether the information is clear and complete.

      Write in the language your customers use, and make sure the key facts are there: price, size, delivery, returns.

  - id: stat-d2c-small-cities
