    hook: 5 minute ka **AI-ready test**
    heading: Apni shop check karo
    items:
      - Price aur stock **text** mein hai, image mein nahi
      - Har product ka **clear title**
      - Size chart aur **material** likha hai
      - Delivery time aur **COD** clear hai
