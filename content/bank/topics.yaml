  - id: tip-faq-section
    pillar: tip
    title: An FAQ section answers the AI's questions
    hook: Customer ke **sawaal pehle se** answer karo
    point: Har product par **5 common sawaal** aur unke jawab likho
    heading: Common sawaal
    items: ["Kya yeh **washable** hai?", "Warranty **kitni** hai?", "Box mein **kya-kya** milega?"]
    linkedin: |
      AI agents answer shoppers' questions on the spot. If the answer is already on your product page, the agent can use it.

      Add a short FAQ to every product: is it washable, what's the warranty, what's in the box. Five questions, five clear answers.

