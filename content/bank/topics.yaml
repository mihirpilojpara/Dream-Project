      India's IT Rules amendment, in force since February 2026, brings "synthetically generated information" under platform rules: AI-generated images and videos must be labelled.

      If you use AI to create product visuals, be transparent. Show real photos of the actual product too, and don't strip platform labels. Trust is the whole game in AI shopping.

