# Episode 01 — "Is your shop visible to AI?"
# Render everything:   python -m studio render content/ep01-is-your-shop-ai-ready.yaml
# Words inside **double stars** get the accent colour + highlighter.
# A scene with `only: youtube` or `only: reel` appears in just that format.

title: Is your shop visible to AI?
slug: ep01-is-your-shop-ai-ready
formats: [reel, youtube]
fps: 30

# Optional audio (leave commented for a silent video and add trending audio inside Instagram):
# music: assets/music/background.mp3
# voiceover:
#   reel: assets/voice/ep01-reel.mp3
#   youtube: assets/voice/ep01-youtube.mp3

scenes:
  - type: hook
    text: Aapki shop **ChatGPT** ko dikhti hai?
    duration: 3.2

  - type: statement
    kicker: The shift
    text: Customers ab Google nahi, **AI se puchte hain**
    duration: 3.4

  - type: chat
    app: AI shopping assistant
    user: Best cotton kurta under ₹1000 batao, jaldi delivery chahiye
    reply: "Here are 3 great options:"
    items:
      - { name: Flipkart, note: 1-day delivery }
      - { name: Big brand store, note: 4.5 rating }
      - { name: Another big seller, note: COD available }
    missing: Aapki shop? **List mein hi nahi.**
    duration: 8.5

  - type: stat
    kicker: India, 2026
    value: 92%
    label: shoppers have **already used AI** while shopping
    source: NielsenIQ, Agentic Commerce India 2026 (top 8 metros)
    duration: 4.2

  - type: statement
    text: AI sirf woh shops recommend karta hai jinka data woh **padh sake**
    sub: Clean product data · Agent-ready payments · Clear delivery info
    duration: 4.2

  - type: compare
    only: youtube
    heading: What an AI agent sees
    left:
      title: Not AI-ready
      items:
        - Product info hidden in images
        - No size, price, stock in clean format
        - Payment only via normal checkout
    right:
      title: AgentReady store
      items:
        - Structured product data agents can read
        - Live price, stock and delivery info
        - Ready for UPI agent payments
    duration: 7.5

  - type: steps
    heading: 3 cheezein aaj hi check karo
    items:
      - Har product ka **price, size, stock** text mein likha ho
      - Delivery aur **COD info** clear ho
      - Product titles simple aur **specific** ho
    duration: 6.5

  - type: cta
    text: AI shopping ki aisi aur baatein? **Follow** karo
    button: Follow @agentready.in
    sub: Comment "READY" for part 2
    duration: 4.2

publish:
  youtube:
    title: "AI Agents Will Shop For Your Customers — Is Your Store Ready? (India)"
    description: |
      Shoppers in India are starting to ask AI assistants what to buy, and AI agents can now complete payments too.
      If an AI can't read your store, it won't recommend you. In this video:
      - How AI shopping assistants pick products
      - What's changing in India (UPI agent payments, ONDC, Flipkart)
      - 3 things every seller can fix today

      Follow for more on AI shopping for Indian sellers. Comment READY if you want part 2.
    tags: [agentic commerce, AI shopping, D2C India, Shopify India, UPI, ONDC, ecommerce tips]
  instagram:
    caption: |
      Aapki shop ChatGPT ko dikhti hai? 👀
      Customers ab AI se puchte hain "best kurta under ₹1000" — aur AI sirf un shops ko recommend karta hai jinka data woh padh sake.
      3 cheezein aaj hi check karo (video dekho) 👆
      Part 2 chahiye? Comment "READY" 👇 aur follow karo @agentready.in
    hashtags: [AgenticCommerce, D2CIndia, ShopifyIndia, EcommerceIndia, AIShopping, SmallBusinessIndia, AgentReady]

# LinkedIn is handled separately (career profile), so this episode makes no carousel.
linkedin: false
