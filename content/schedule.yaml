# 90-day content calendar (see docs/90-day-plan.md).
# Each posting day takes the next topic from content/bank/topics.yaml, in order.
# GitHub renders the day's content every morning (.github/workflows/daily.yml).

start_date: 2026-11-16          # Monday, week 1
end_date: 2027-02-14            # Sunday, week 13 (90 days)
timezone: Asia/Kolkata

# Shorts/Reels go out Monday to Friday. Saturday is a rest day (and buffer if a day slips).
post_days: [mon, tue, wed, thu, fri]

# Sunday: a 16:9 YouTube video stitching the week's 5 lessons (reuses your recordings).
weekly_youtube_day: sunday

# LinkedIn is for job/career posts, handled separately. No auto carousels.
linkedin: false

# After the bank is used up: repeat | stop
when_bank_runs_out: stop

# Post a specific topic on a specific day (breaking news, a great comment to answer):
overrides: {}
#  2026-12-03: news-shopify-agents

# Days with no Short (travel, illness, festival):
skip: []
#  - 2026-12-25
